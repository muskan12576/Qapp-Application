# Memory-optimized settings to prevent Windows VirtualAlloc/Dart VM OOM crash
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1024m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template.
# Flutter 3.44 still applies the legacy Kotlin plugin to plugins such as jni.
# Keep this false until the app and every plugin support built-in Kotlin.
android.builtInKotlin=false
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
